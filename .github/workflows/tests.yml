name: Offline package tests
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'profiles/**'
      - 'examples/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'profiles/**'
      - 'examples/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Run offline contract and CLI tests
        run: |
          mkdir -p .local/tmp
          TMPDIR="$PWD/.local/tmp" python -m unittest discover -s tests -v
      - name: Check installed CLI
        run: ngen-reforecast --version
